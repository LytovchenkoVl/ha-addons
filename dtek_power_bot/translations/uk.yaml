configuration:
  telegram_token:
    name: Токен Telegram-бота
    description: Отримайте в @BotFather командою /newbot
  poll_minutes:
    name: Перевіряти кожні (хв)
    description: Як часто бот звіряє графік із сайтом ДТЕК
  allow_all:
    name: Доступ для всіх
    description: Увімкнено — ботом може користуватися будь-хто. Вимкнено — лише люди зі списку нижче
  allowed_users:
    name: Дозволені користувачі
    description: Telegram ID (числом) або @username, по одному в рядку. Діє, коли «Доступ для всіх» вимкнено
  deny_message:
    name: Відповідь для сторонніх
    description: Що бот напише людині без доступу. Свій Telegram ID вона побачить під цим текстом
  admin_users:
    name: Адміністратори
    description: Telegram ID (числом) або @username тих, кому доступна команда /stats. Адміністратори завжди мають доступ до бота
  maintenance:
    name: Технічні роботи
    description: Увімкнули, зберегли й перезапустили аддон — бот розсилає всім текст про роботи і поки що відповідає лише ним (адміністраторам — як звичайно); вимкнули — розсилає текст про завершення. З автоматизації — служба hassio.addon_stdin з input maintenance_on / maintenance_off
  maintenance_text:
    name: Текст про технічні роботи
    description: Бот розсилає його всім, коли перемикач увімкнули, і відповідає ним, поки роботи тривають
  maintenance_end_text:
    name: Текст про завершення робіт
    description: Бот розсилає його всім, коли перемикач вимкнули
